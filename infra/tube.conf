; supervisor unit — /etc/supervisor/conf.d/tube.conf
;
; v1 set only ENV=staging here and never passed an API key through at all, so the
; server relied on whatever happened to be in root's shell. The key is now read from
; /root/tube/.env by the wrapper below rather than being inlined, because supervisor
; config files are world-readable on a default Ubuntu box.
[program:tube]
command=/bin/bash -lc 'set -a; . /root/tube/.env; set +a; exec node /root/tube/server'
directory=/root/tube
user=root
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tube.log
stdout_logfile_maxbytes=50MB
environment=NODE_ENV="production",PORT="3003",HOST="127.0.0.1"
